name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - './src/transactions/**' # Only trigger if files in this subfolder change
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: ./src/transactions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install

    - run: npm run test:e2e