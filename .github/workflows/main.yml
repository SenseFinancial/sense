name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - './src/transactions/**' # Only trigger if files in this subfolder change
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: ./src/transactions

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm run test:e2e